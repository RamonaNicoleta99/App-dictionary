<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Dictionary - Kickoff</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="./assets/style/main.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand" href="./">Dictionary App</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="#navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="./">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./dictionary.html">Dictionary</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container my-5">
      <!-- Formular de cautare-->
      <section class="mb-4">
        <h1 class="display-4 fw-ight text-center mb-4">Search a Word</h1>
        <form
          id="search-form"
          class="input-group mx-auto"
          style="max-width: 500px"
        >
          <input
            type="text"
            class="form-control"
            id="search-input"
            placeholder="e.g. morning"
          />

          <button type="submit" class="btn btn-primary" id="search-button">
            Search
          </button>
        </form>
      </section>

      <!-- Zona pentru rezultate -->
      <section
        id="result"
        class="mb-4 p-4 border rounded"
        style="min-height: 150px"
      >
        <p class="text-muted text-center">
          Enter a word to see its definition.
        </p>
      </section>

      <!-- Lista de cuvinte salvate -->
      <section>
        <h3 class="mb-3">Saved Words</h3>
        <ul id="word-list" class="List-group"></ul>
      </section>
    </div>
    <!-- Footer -->

    <footer class="d-flex flex-wrap align-items-center py-3 my-4 border-top">
      <div class="col-md-4 d-flex align-items-center">
        <span class="mb-3 mb-md-0 text-body-secondary"
          >© 2025 Dictionary App</span
        >
      </div>
    </footer>
    <script src="./assets/js/script.js"></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
